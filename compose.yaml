services:
  web:
    build: .
    command: >-
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DB_NAME: resirate
      DB_USER: resirate_app
      DB_PASSWORD: local_dev_password
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: resirate
      POSTGRES_USER: resirate_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resirate_app -d resirate"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
