{% extends "base.html" %}

{% block title %}Delete issue report{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <h1 class="h3">Delete this issue report?</h1>
      <p>"{{ issue.title }}" at <strong>{{ issue.building.address }}</strong> will be permanently removed.</p>
      <form method="post" action="{% url 'reviews:issue_delete' issue.pk %}" class="d-flex flex-wrap gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete report</button>
        <a class="btn btn-outline-secondary" href="{% url 'buildings:detail' issue.building.pk %}">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
